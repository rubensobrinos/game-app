profile: node-esm-app
profile_version: 0.16.0
# Repo-eigen autonomy-overrides. Scalaire velden overschrijven de globale
# agent-rules.md; lijstvelden (forbidden_paths e.d.) worden samengevoegd, dus
# de globale verboden paden blijven onverkort gelden.
#
# Reden voor de verruiming: dit repo wordt per specificatiedocument opgebouwd in
# losse, volledig geteste modules. Eén module + bijbehorende fixture-gedreven
# testsuite is routineus 700-1000 nieuwe regels; de oude globale grens dwong
# dan tot het kunstmatig opknippen van één samenhangende wijziging over
# meerdere commits, wat de review juist moeilijker maakt in plaats van veiliger.
autonomy_overrides:
  max_files_changed_without_approval: 15
  max_lines_changed_without_approval: 5000
durability:
  unique_state: true
  systems:
    - name: gamestats
      kind: postgres
      authoritative: true
      recovery: back-up via de standaard postgres-route van db-gateway (ADR-0005, dagelijkse dump met hersteltest); schema staat ook in migrations/001-analytics.sql
      register: gamestats
      backup: standaard
  # redis (volume redis-data) bewust niet gedeclareerd: houdt alleen lopende
  # multiplayer-state vast (room/match/ronde/antwoorden, TTL GAME_TTL_SECONDS
  # van 4u, zie server/composition/match/herstel.mjs) — bij verlies van het
  # volume start een lopend spel opnieuw, geen blijvend verlies. De
  # definitieve, privacy-minimale analytics landen in de postgres-tabellen
  # hierboven (migrations/001-analytics.sql).
managed_hashes:
  .pre-commit-config.yaml: 64ebce0a75ce245fd03e2deabcf591a030e2e48595ecffca8fbba1d2a1609edf
  .github/workflows/ci.yml: a7610738bb4e0dd77d9cf3b55b31d37f21336b1c7bfe26bd4e1c65fcda785ac5
  .gitignore: 2880cea350b41205cfb39ab0d109c1aa0a414bbab97080095cc766f6eebbd66d
  CLAUDE.md: cdd79e65c43d29b465c3d46a21d45784512797d9a08b6b9efe7e845b253e086c
domein: rounda.io
