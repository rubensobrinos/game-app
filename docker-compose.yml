# docker-compose.yml — fase 1-stack, vertaald uit de referentie in
# docs/multiplayer/DEPLOYMENT-AND-TESTING.md.
#
# Afwijkingen t.o.v. de referentie, met reden:
#   - frontend mount: de singleplayer-game staat in de repo-root (index.html,
#     app.js, data/, flags/, ...), er is (nog) geen frontend/dist met
#     fingerprinted builds. De benodigde bestanden worden individueel read-only
#     gemount, zodat .git, server/, docs/ enz. NIET publiek worden.
#   - game-server build.context is de repo-root (Dockerfile kopieert
#     package.json en straks shared/).
#   - LET OP (juridisch, PRODUCT.md): logos/ en football/ worden hier WEL
#     gemount omdat de singleplayer-UI ze verwacht. Vóór de PUBLIEKE launch:
#     logospellen uitschakelen in de build of deze mounts weghalen — zie
#     docs/fase1-runbook.md, openstaand punt 1.
#
# Poorten 80/443 horen bij directe exposure/port forwarding. Bij Cloudflare
# Tunnel: draai met het override-bestand, dat de poorten sluit:
#   docker compose -f docker-compose.yml -f compose.tunnel.override.yml \
#     --profile tunnel up -d

name: aseso-game

services:
  reverse-proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      game-server:
        condition: service_healthy
    networks: [edge, internal]

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./hint.js:/usr/share/nginx/html/hint.js:ro
      - ./public-mode.js:/usr/share/nginx/html/public-mode.js:ro
      - ./favicon.svg:/usr/share/nginx/html/favicon.svg:ro
      - ./apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./og-image.png:/usr/share/nginx/html/og-image.png:ro
      - ./flaginfo.js:/usr/share/nginx/html/flaginfo.js:ro
      - ./geo.js:/usr/share/nginx/html/geo.js:ro
      - ./geo-facts.js:/usr/share/nginx/html/geo-facts.js:ro
      # /progress — het voortgangsoverzicht. Bewust twee losse mappen en niet
      # heel `docs/`: STATUS.md, DECISIONS.md en de professionaliserings-
      # adviezen (waaronder een securityanalyse) komen zo de container niet
      # eens in. nginx serveert hiervan alleen de pagina en de vijf
      # PROGRESS.md-bestanden — zie nginx/default.conf.
      - ./docs/progress:/usr/share/nginx/html/docs/progress:ro
      - ./docs/design-documentation:/usr/share/nginx/html/docs/design-documentation:ro
      - ./data:/usr/share/nginx/html/data:ro
      - ./flags:/usr/share/nginx/html/flags:ro
      - ./logos:/usr/share/nginx/html/logos:ro
      - ./football:/usr/share/nginx/html/football:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      MAX_PLAYERS_PER_GAME: "100"
      GAME_TTL_SECONDS: "14400"
      CONTENT_VERSION: ${CONTENT_VERSION}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamestats
      POSTGRES_USER: gameapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameapp -d gamestats"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles: ["tunnel"]
    depends_on:
      reverse-proxy:
        condition: service_started
    networks: [edge]

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  pg-data:
