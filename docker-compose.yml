# docker-compose.yml — fase 1-stack, vertaald uit de referentie in
# docs/multiplayer/DEPLOYMENT-AND-TESTING.md.
#
# Afwijkingen t.o.v. de referentie, met reden:
#   - frontend build.context is de repo-root (nginx/Dockerfile kopieert de
#     singleplayer-sitebestanden uit de repo-root, er is (nog) geen
#     frontend/dist met fingerprinted builds — zie nginx/Dockerfile voor
#     welke bestanden en waarom, inclusief de LET OP over logos/football).
#   - reverse-proxy build.context is de repo-root (caddy/Dockerfile kopieert
#     caddy/Caddyfile erin).
#     Vóór kaart #100796 waren frontend en reverse-proxy allebei bind mounts
#     vanuit de git-werkmap zelf: elke opgeslagen wijziging stond dan zonder
#     release, commit of review live op rounda.io (bevestigd voor frontend
#     via `docker inspect aseso-game-frontend-1`). Zie devkit ADR-0037's
#     amendement ("statische bestanden nooit bind-mounten in productie") voor
#     het bredere patroon.
#   - game-server build.context is de repo-root (Dockerfile kopieert
#     package.json en straks shared/).
#
# Poorten 80/443 horen bij directe exposure/port forwarding. Bij Cloudflare
# Tunnel: draai met het override-bestand, dat de poorten sluit:
#   docker compose -f docker-compose.yml -f compose.tunnel.override.yml \
#     --profile tunnel up -d

name: aseso-game

services:
  reverse-proxy:
    build:
      context: .
      dockerfile: caddy/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      game-server:
        condition: service_healthy
    networks: [edge, internal]

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

  game-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_PEPPER: ${TOKEN_PEPPER}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      MAX_PLAYERS_PER_GAME: "100"
      GAME_TTL_SECONDS: "14400"
      CONTENT_VERSION: ${CONTENT_VERSION}
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamestats
      POSTGRES_USER: gameapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameapp -d gamestats"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    profiles: ["tunnel"]
    depends_on:
      reverse-proxy:
        condition: service_started
    networks: [edge]

networks:
  edge:
  internal:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  pg-data:
