# deploy/omgeving.conf — de omgevingen van rounda.io (devkit ADR-0032, ADR-0035, ADR-0037).
#
# Het enige bestand dat je invult. start.sh, uitrollen-test.sh en release.sh lezen
# het en bevatten zelf geen poort, database of pad. Geen geheimen hier: die staan in
# de env-bestanden hieronder (mode 600, buiten git).
#
# Gemaakt met `devkit template omgevingen rounda.io`.

NAAM="rounda"
DOMEIN="rounda.io"
LABEL="nl.aseso.rounda"                 # launchd: $LABEL.productie, $LABEL.test, $LABEL.uitrol-test

# Poorten: vrij (`lsof -nP -iTCP:<poort> -sTCP:LISTEN` is leeg) en ingeschreven in
# ~/dev/0. PORTS.md. Leeg = start.sh weigert.
POORT_PRODUCTIE=""   # leeg: productie is compose-project aseso-game (80/443 + tunnel-container), zie deploy/README.md
POORT_TEST="8140"

# Databasenamen. start.sh weigert als een DATABASE_URL* naar een andere database
# wijst, of ontbreekt terwijl hier een naam staat. Leeg = geen database.
DB_PRODUCTIE="gamestats"
DB_TEST="gamestats_test"

# Waar de omgevingen draaien, buiten deze checkout.
TEST_WORKTREE="/Users/ruben/.devkit/sites/rounda/test"     # devkit ADR-0038: vaste plek per site (git worktree move)
RELEASES="$HOME/releases/rounda"  # productie: $RELEASES/live, $RELEASES/vorige (ADR-0035, geen symlink)

# Geheimen en instellingen per omgeving (mode 600, buiten git). De app krijgt daarnaast
# OMGEVING (test|productie), PORT, HOST=127.0.0.1 en PUBLIC_URL mee.
ENV_PRODUCTIE="$HOME/.config/rounda/productie.env"
ENV_TEST="$HOME/.config/rounda/test.env"

# Commando's, uitgevoerd in de map van de omgeving (releasemap of test-worktree).
# STARTEN moet PORT en HOST respecteren. Verwijs je naar een variabele, gebruik dan
# enkele quotes ('... --port $PORT'): tussen dubbele wordt hij al bij het inlezen ingevuld.
BOUWEN='docker compose -p rounda-test -f docker-compose.yml -f compose.testsite.override.yml build'
STARTEN='docker compose -p rounda-test -f docker-compose.yml -f compose.testsite.override.yml up -d --remove-orphans && exec docker compose -p rounda-test -f docker-compose.yml -f compose.testsite.override.yml logs -f --no-color'

# Eigen eis per omgeving: een shell-voorwaarde die waar moet zijn, anders weigert start.sh
# (exit 78). Enkele quotes, zodat de variabelen pas bij de controle worden ingevuld.
# Voorbeeld: EIS_TEST='[ "${NOTIFICATION_PROVIDER:-fake}" = fake ]'  (op test nooit echte sms)
EIS_TEST='[ "${PUBLIC_APP_URL:-}" = "https://test.rounda.io" ] && [ -z "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]'   # QR-links naar test; nooit een tweede connector op het productietoken
EIS_PRODUCTIE=""

# Rookproef: elk pad moet binnen ROOKPROEF_WACHTEN seconden 200 geven op 127.0.0.1:<poort>.
ROOKPROEF_PADEN="/ /solo /style.css"   # game-server én nginx met zijn mounts (wat op productie stuk is, zie README)
ROOKPROEF_WACHTEN=90   # postgres, redis en de game-server moeten eerst gezond zijn

# Aantal productiereleases dat blijft staan. De vorige blijft altijd staan, als terugrolpunt.
RELEASES_BEWAREN=3

# Releaselog (devkit ADR-0035): org-breed bestand, niet per repo. Elke releasepoging
# (geslaagd of niet) krijgt hier één regel: tijdstip, site, tag, commit, wie, uitslag.
RELEASES_LOG="$HOME/.devkit/releases/releases.jsonl"

# Naam van deze site zoals hij in het releaselog en de ADM-pagina Releases komt.
# Standaard het domein zelf; alleen invullen als dat moet afwijken.
RELEASE_SITENAAM="rounda.io"

# Releasevorm voor productie (devkit ADR-0037): rounda's productie is het
# compose-project aseso-game (POORT_PRODUCTIE hierboven staat daarom leeg), dus
# "compose" i.p.v. het default "mappen"-pad uit ADR-0035.
RELEASE_VORM="compose"
COMPOSE_PROJECT="aseso-game"
COMPOSE_BESTANDEN="docker-compose.yml"
COMPOSE_DIENSTEN="game-server"          # enige dienst met een build:-directive; reverse-proxy/frontend/redis/postgres/cloudflared worden nooit geraakt (--no-deps)
COMPOSE_ROOKPROEF_POORT="80"            # caddy (reverse-proxy), zie ROOKPROEF_PADEN hierboven

# Migratiedetectie (devkit ADR-0037): migrations/ bestaat al in deze repo
# (001-analytics.sql). Een release met een gewijzigd bestand daaronder rolt
# bij een rode rookproef niet automatisch terug — release_compose() meldt
# dan "handmatig beslissen" i.p.v. terug te gaan naar een mogelijk
# incompatibel schema.
MIGRATIE_PAD="migrations"
