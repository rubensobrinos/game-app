<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rounda — Samen spelen</title>
    <meta name="description" content="Speel de vlaggenquiz samen: één host, QR scannen en meedoen. Geen account nodig." />
    <meta name="theme-color" content="#0d0d1a" />
    <meta property="og:title" content="Rounda — Samen spelen" />
    <meta property="og:description" content="Scan de QR en speel direct mee. Geen account nodig." />
    <meta property="og:image" content="https://rounda.io/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- UI-3 beantwoord (docs/integration-plan/transport-contract-response.md):
         INT-A serveert frontend/ als eigen root en voegt twee statische
         mappings toe (/client/* -> client/, /shared/* -> shared/). Met
         <base href="/"> lossen absolute paden hieronder correct op vanaf elke
         deep link (/j/{inviteId}, /game/{code}, /host/{code}), niet alleen /. -->
    <base href="/" />
    <link rel="stylesheet" href="/css/tokens.css?v=1c34" />
    <link rel="stylesheet" href="/css/reset.css?v=1c34" />
    <link rel="stylesheet" href="/css/layout.css?v=1c34" />
    <link rel="stylesheet" href="/css/lobby.css?v=1c34" />
    <link rel="stylesheet" href="/css/session.css?v=1c34" />
    <link rel="stylesheet" href="/css/components-core.css?v=1c34" />
    <link rel="stylesheet" href="/css/forms.css?v=1c34" />
    <link rel="stylesheet" href="/css/gameplay.css?v=1c34" />
    <link rel="stylesheet" href="/css/results.css?v=1c34" />
    <!-- Transplantatielaag richting 1c — laadt bewust als laatste, in dezelfde
         cascadevolgorde als de oude rounda-1c.css. De `@font-face`-regels
         (zelf gehost, fase 3 F4) staan in tokens.css, niet hier — er is geen
         Google Fonts-link meer. -->
    <link rel="stylesheet" href="/css/1c-merk.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-home.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-chrome.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-lobby.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-spel.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-uitslag.css?v=1c34" />
    <link rel="stylesheet" href="/css/1c-overrides.css?v=1c34" />
  </head>
  <body>
    <!-- Buiten #app-root: overleeft elke routewissel (die maakt alleen
         #app-root leeg). Hamburgermenu (taal van de app-UI + licht/donker-
         thema) wordt hier door app-menu.mjs in gemount, zichtbaar op elk
         scherm vanaf de indexpagina. -->
    <div id="app-header"></div>
    <!-- Lege root-container: UI1-UI5 monteren hier hun schermen. -->
    <div id="app-root"></div>
    <!-- De losse link naar de oude sologames op /solo is weg (besluit C-1,
         5 aug 2026): alleen spelen is nu een modus van déze app — de knop
         "Alleen spelen" staat op het homescherm zelf. Twee ingangen naar
         hetzelfde doel is precies wat D-018 verbiedt. De oude app blijft
         bereikbaar op /solo tot de convergentie af is; hij wordt alleen niet
         meer aangeprezen. -->
    <footer class="app-footer">
      <!-- Feedback 4 aug (punt 2): bescheiden copyright -->
      <span class="app-footer-copy">© 2026 Rounda · Aseso B.V. · Alle rechten voorbehouden · rounda.io</span>
    </footer>
    <script type="module" src="/js/app.mjs"></script>
  </body>
</html>
