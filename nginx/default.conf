# nginx/default.conf — frontend (statische singleplayer-game), fase 1.
# Cachebeleid conform DEPLOYMENT-AND-TESTING.md: HTML kort, assets lang.
# Fingerprinted filenames bestaan nog niet, dus assets krijgen hier een
# gematigde cache (1 dag) i.p.v. "immutable, 1 jaar" — dat volgt pas met een
# echte build-stap.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HTML: altijd vers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Statische assets: 1 dag, tot er fingerprinting is.
    location ~* \.(js|css|png|webp|avif|svg|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ── /progress — het voortgangsoverzicht ───────────────────────────────
    # Intern document op een publiek domein. Daarom drie afbakeningen:
    #
    #  1. Alleen `docs/progress/` en `docs/design-documentation/` zitten
    #     überhaupt in de container (zie docker-compose.yml). STATUS.md,
    #     DECISIONS.md en de professionaliseringsadviezen — waaronder een
    #     securityanalyse — komen er niet in, dus die kunnen ook niet lekken
    #     door een fout in dit bestand.
    #  2. Van wat er wél in zit serveert nginx alleen de pagina zelf en de
    #     vijf PROGRESS.md-bestanden. De elf ontwerpdocumenten staan in de
    #     container maar hebben geen enkele route.
    #  3. `noindex, nofollow`: niet in zoekmachines. Een header werkt hier
    #     beter dan robots.txt — die laatste vraagt om medewerking, deze
    #     instrueert de crawler die de pagina al heeft.
    #
    # Wil je dit afschermen met een wachtwoord, dan is dat één `basicauth`-
    # blok in caddy/Caddyfile; nginx hoeft daar niet voor te wijzigen.

    location = /progress {
        return 301 /progress/;
    }

    location /progress/ {
        alias /usr/share/nginx/html/docs/progress/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # De data van het dashboard: uitsluitend PROGRESS.md, uitsluitend één map
    # diep. Elk ander pad in de designmap valt hierbuiten en krijgt de 404 van
    # de regel eronder.
    location ~ ^/design-documentation/design/[^/]+/PROGRESS\.md$ {
        root /usr/share/nginx/html/docs;
        default_type text/markdown;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
    }

    # Alles wat de container aan documentatie bevat maar niet bedoeld is om
    # te serveren. Geen 403 maar 404: een 403 bevestigt dat er iets is.
    #
    # Bewust géén `^~`: die modifier laat nginx de regex-locaties overslaan
    # zodra dit prefix matcht, en dan wordt ook de PROGRESS.md-whitelist
    # hierboven nooit meer bereikt. Met een gewoon prefix wint de regex, wat
    # hier precies de bedoeling is.
    location /design-documentation/ {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }
}
