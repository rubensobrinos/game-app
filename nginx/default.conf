# nginx/default.conf — frontend (statische singleplayer-game), fase 1.
# Cachebeleid conform DEPLOYMENT-AND-TESTING.md: HTML kort, assets lang.
# Fingerprinted filenames bestaan nog niet, dus assets krijgen hier een
# gematigde cache (1 dag) i.p.v. "immutable, 1 jaar" — dat volgt pas met een
# echte build-stap.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HTML: altijd vers.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Statische assets: 1 dag, tot er fingerprinting is.
    location ~* \.(js|css|png|webp|avif|svg|jpg|jpeg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
}
